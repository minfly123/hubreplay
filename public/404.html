<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hub Replay</title>
    <script>
      // GitHub Pages SPA fallback: keep the requested path and let the app router handle it.
      sessionStorage.setItem("spa-redirect", window.location.pathname + window.location.search + window.location.hash);
      window.location.replace("/");
    </script>
  </head>
  <body></body>
</html>
